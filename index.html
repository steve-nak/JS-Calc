<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expression Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator-container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .calculator {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #expression {
            padding: 1rem;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: border-color 0.3s;
            outline: none;
        }

        #expression:focus {
            border-color: #667eea;
        }

        #calculateBtn {
            padding: 1rem;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        #calculateBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #calculateBtn:active {
            transform: translateY(0);
        }

        .result {
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 10px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            border: 2px solid #e9ecef;
        }

        .result.error {
            color: #dc3545;
            font-size: 1rem;
        }

        .result.success {
            color: #28a745;
        }

        .result:empty::before {
            content: 'Result will appear here';
            color: #999;
            font-size: 1rem;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <h1>Expression Calculator</h1>
        <div class="calculator">
            <input type="text" id="expression" placeholder="Enter expression (e.g., 2+2*3)" autocomplete="off">
            <button id="calculateBtn">Calculate</button>
            <div id="result" class="result"></div>
        </div>
    </div>
    <script>
        // Get DOM elements
        const expressionInput = document.getElementById('expression');
        const calculateBtn = document.getElementById('calculateBtn');
        const resultDiv = document.getElementById('result');

        // Calculate function
        function calculate() {
            const expression = expressionInput.value.trim();
            
            // Clear previous result
            resultDiv.textContent = '';
            resultDiv.className = 'result';
            
            // Check if expression is empty
            if (!expression) {
                resultDiv.textContent = 'Please enter an expression';
                resultDiv.classList.add('error');
                return;
            }
            
            try {
                // Validate expression - only allow numbers, operators, parentheses, dots, and spaces
                const validPattern = /^[0-9+\-*/.() ]+$/;
                if (!validPattern.test(expression)) {
                    throw new Error('Invalid characters in expression');
                }
                
                // Evaluate the expression using Function constructor (safer than eval)
                const result = Function('"use strict"; return (' + expression + ')')();
                
                // Check if result is a valid number
                if (typeof result !== 'number' || !isFinite(result)) {
                    throw new Error('Invalid result');
                }
                
                // Display result
                resultDiv.textContent = `= ${result}`;
                resultDiv.classList.add('success');
            } catch (error) {
                // Display error message
                resultDiv.textContent = `Error: Invalid expression`;
                resultDiv.classList.add('error');
            }
        }

        // Event listeners
        calculateBtn.addEventListener('click', calculate);

        // Allow Enter key to calculate
        expressionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                calculate();
            }
        });

        // Focus on input when page loads
        window.addEventListener('load', () => {
            expressionInput.focus();
        });
    </script>
</body>
</html>
